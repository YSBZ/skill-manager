name: Prepare v1.1.0 release assets

on:
  push:
    branches: [codex/release-v1.1.0]
    paths: [.github/workflows/release-v1.1.0.yml]

permissions:
  contents: write

env:
  GH_REPO: YSBZ/skill-manager
  RELEASE_TAG: v1.1.0

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.5'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
      - name: Verify and build universal desktop packages
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          node --test internal/server/dist/*.test.js
          make desktop-dist desktop-dmg UPDATE_FEED=https://raw.githubusercontent.com/YSBZ/skill-manager/main/release/latest.json UPDATE_TOKEN= FEEDBACK_ENDPOINT= FEEDBACK_TOKEN= CONTENT_SERVICE_URL=
          codesign --verify --deep --strict dist/SkillManager.app
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, plistlib, zipfile
          p = plistlib.loads(Path('dist/SkillManager.app/Contents/Info.plist').read_bytes())
          assert p['CFBundleShortVersionString'] == '1.1.0' and p['CFBundleVersion'] == '64'
          assets = []
          for path in (Path('dist/pkg/SkillManager-desktop-macos-v1.1.0.zip'), Path('dist/SkillManager-v1.1.0.dmg')):
              if path.suffix == '.zip':
                  with zipfile.ZipFile(path) as z:
                      assert z.testzip() is None
                      assert not any(Path(n.filename).name in ('node', 'node.exe', 'content.db', 'credentials.yaml', 'token') for n in z.infolist() if not n.is_dir())
              with path.open('rb') as f:
                  digest = hashlib.file_digest(f, 'sha256').hexdigest()
              assets.append({'name': path.name, 'sha256': digest, 'bytes': path.stat().st_size})
          Path('dist/macos-assets.json').write_text(json.dumps({'version':'1.1.0','releaseCode':'64','assets':assets}, indent=2) + '\n')
          PY
      - name: Upload verified packages to existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" --clobber dist/pkg/SkillManager-desktop-macos-v1.1.0.zip dist/SkillManager-v1.1.0.dmg dist/macos-assets.json

  windows-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify exact vendor source packages
        run: |
          set -euo pipefail
          mkdir -p source-assets
          curl --fail --location --retry 3 --max-time 120 https://raw.githubusercontent.com/msys2/MSYS2-keyring/5d249077a0cfeec9dbf51515e5e01da413d28859/msys2.gpg --output source-assets/msys2.gpg
          echo '1257d4ccc536c53333445a618039af4c3ea3f56b96601de9af89151ea529c19a  source-assets/msys2.gpg' | sha256sum --check
          for spec in 'mingw:mingw-w64-gcc-16.2.0-6.src.tar.zst' 'msys:msys2-runtime-3.6.10-4.src.tar.zst'; do
            repo="${spec%%:*}"
            file="${spec#*:}"
            curl --fail --location --retry 3 --max-time 600 "https://repo.msys2.org/$repo/sources/$file" --output "source-assets/$file"
            curl --fail --location --retry 3 --max-time 120 "https://repo.msys2.org/$repo/sources/$file.sig" --output "source-assets/$file.sig"
            gpgv --keyring "$PWD/source-assets/msys2.gpg" "source-assets/$file.sig" "source-assets/$file"
            zstd --test "source-assets/$file"
            tar --zstd -tf "source-assets/$file" > "source-assets/$file.contents.txt"
            srcinfo="$(python3 -c 'import pathlib,sys; print(next(n for n in pathlib.Path(sys.argv[1]).read_text().splitlines() if n.endswith("/.SRCINFO") or n == ".SRCINFO"))' "source-assets/$file.contents.txt")"
            tar --zstd -xOf "source-assets/$file" "$srcinfo" > "source-assets/$file.SRCINFO"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          assets = []
          for name, version, revision in (('mingw-w64-gcc-16.2.0-6.src.tar.zst','16.2.0','6'), ('msys2-runtime-3.6.10-4.src.tar.zst','3.6.10','4')):
              path = Path('source-assets') / name
              info = Path(str(path) + '.SRCINFO').read_text()
              assert re.search(r'(?m)^\s*pkgver\s*=\s*' + re.escape(version) + r'\s*$', info)
              assert re.search(r'(?m)^\s*pkgrel\s*=\s*' + re.escape(revision) + r'\s*$', info)
              with path.open('rb') as f:
                  digest = hashlib.file_digest(f, 'sha256').hexdigest()
              assets.append({'name':name, 'sha256':digest, 'bytes':path.stat().st_size, 'signatureVerified':True, 'archiveVerified':True})
          Path('source-assets/windows-source-assets.json').write_text(json.dumps({'keyringCommit':'5d249077a0cfeec9dbf51515e5e01da413d28859','assets':assets},indent=2) + '\n')
          PY
      - name: Upload verified source packages to existing draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" --clobber source-assets/*.src.tar.zst source-assets/*.SRCINFO source-assets/windows-source-assets.json
